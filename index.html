<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DocReader — Acceso</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f0f13; --surface: #1a1a24; --surface2: #24243a;
      --accent: #7c5cfc; --accent2: #a78bfa; --text: #e8e8f0;
      --muted: #7878a0; --border: #2e2e45; --danger: #f87171; --radius: 12px;
    }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 24px;
    }
    .lock-icon { font-size: 3rem; margin-bottom: 16px; filter: drop-shadow(0 0 24px rgba(124,92,252,0.4)); }
    h1 {
      font-size: 2rem; font-weight: 700;
      background: linear-gradient(135deg, var(--accent2), var(--accent));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; letter-spacing: -0.5px; margin-bottom: 8px; text-align: center;
    }
    p.subtitle { color: var(--muted); font-size: 0.95rem; margin-bottom: 36px; text-align: center; }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 32px; width: 100%; max-width: 380px;
    }
    label { display: block; font-size: 0.78rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: 1px; color: var(--muted); margin-bottom: 10px; }
    input[type="password"] {
      width: 100%; background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); padding: 12px 16px; font-size: 1rem;
      outline: none; transition: border-color 0.2s; letter-spacing: 2px;
    }
    input[type="password"]:focus { border-color: var(--accent); }
    input[type="password"]::placeholder { letter-spacing: 0; color: var(--muted); }
    button {
      width: 100%; margin-top: 16px; background: var(--accent); color: #fff;
      border: none; border-radius: 8px; padding: 12px; font-size: 1rem;
      font-weight: 600; cursor: pointer; transition: opacity 0.15s, transform 0.1s;
    }
    button:hover { opacity: 0.88; }
    button:active { transform: scale(0.98); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .error-msg { margin-top: 14px; font-size: 0.85rem; color: var(--danger); text-align: center; min-height: 20px; }
    .shake { animation: shake 0.35s ease; }
    @keyframes shake {
      0%, 100% { transform: translateX(0); } 20% { transform: translateX(-8px); }
      40% { transform: translateX(8px); }  60% { transform: translateX(-6px); }
      80% { transform: translateX(6px); }
    }
  </style>
</head>
<body>
  <div class="lock-icon">🎧</div>
  <h1>DocReader</h1>
  <p class="subtitle">Ingresa la contraseña para continuar</p>
  <div class="card">
    <label for="password">Contraseña</label>
    <input type="password" id="password" placeholder="••••••••" autofocus />
    <button id="btnEnter" onclick="login()">Entrar</button>
    <div class="error-msg" id="errorMsg"></div>
  </div>
  <script>
    const input = document.getElementById('password');
    const btn   = document.getElementById('btnEnter');
    const err   = document.getElementById('errorMsg');

    input.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });

    async function login() {
      const password = input.value;
      if (!password) return;
      btn.disabled = true;
      btn.textContent = 'Verificando…';
      err.textContent = '';
      try {
        const res = await fetch('/.netlify/functions/auth', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password })
        });
        if (res.ok) {
          sessionStorage.setItem('dr_pass', password);
          window.location.href = '/app.html';
        } else {
          showError('Contraseña incorrecta');
        }
      } catch (e) {
        showError('Error de conexión');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Entrar';
      }
    }

    function showError(msg) {
      err.textContent = msg;
      const card = document.querySelector('.card');
      card.classList.remove('shake');
      void card.offsetWidth;
      card.classList.add('shake');
      input.select();
    }

    if (sessionStorage.getItem('dr_pass')) window.location.href = '/app.html';
  </script>
</body>
</html>
