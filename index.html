<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DocReader — Acceso</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0f0f13; --surface: #1a1a24; --surface2: #24243a;
      --accent: #7c5cfc; --accent2: #a78bfa; --text: #e8e8f0;
      --muted: #7878a0; --border: #2e2e45; --danger: #f87171; --radius: 12px;
    }
    body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 24px;
    }
    .icon { font-size: 3rem; margin-bottom: 16px; filter: drop-shadow(0 0 24px rgba(124,92,252,0.4)); }
    h1 {
      font-size: 2rem; font-weight: 700;
      background: linear-gradient(135deg, var(--accent2), var(--accent));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; letter-spacing: -0.5px; margin-bottom: 8px; text-align: center;
    }
    p.subtitle { color: var(--muted); font-size: 0.9rem; margin-bottom: 32px; text-align: center; line-height: 1.5; }
    .card {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 32px; width: 100%; max-width: 400px;
    }
    label { display: block; font-size: 0.78rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: 1px; color: var(--muted); margin-bottom: 10px; }
    input {
      width: 100%; background: var(--surface2); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text); padding: 12px 16px; font-size: 0.9rem;
      outline: none; transition: border-color 0.2s; font-family: monospace;
    }
    input:focus { border-color: var(--accent); }
    input::placeholder { color: var(--muted); font-family: sans-serif; }
    .hint { font-size: 0.78rem; color: var(--muted); margin-top: 8px; line-height: 1.4; }
    .hint a { color: var(--accent2); text-decoration: none; }
    .hint a:hover { text-decoration: underline; }
    button {
      width: 100%; margin-top: 20px; background: var(--accent); color: #fff;
      border: none; border-radius: 8px; padding: 13px; font-size: 1rem;
      font-weight: 600; cursor: pointer; transition: opacity 0.15s, transform 0.1s;
    }
    button:hover { opacity: 0.88; }
    button:active { transform: scale(0.98); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .error-msg { margin-top: 14px; font-size: 0.85rem; color: var(--danger); text-align: center; min-height: 20px; }
    .shake { animation: shake 0.35s ease; }
    @keyframes shake {
      0%,100%{transform:translateX(0)} 20%{transform:translateX(-8px)}
      40%{transform:translateX(8px)} 60%{transform:translateX(-6px)} 80%{transform:translateX(6px)}
    }
  </style>
</head>
<body>
  <div class="icon">🎧</div>
  <h1>DocReader</h1>
  <p class="subtitle">Ingresa tu API key de ElevenLabs<br>para comenzar</p>

  <div class="card">
    <label for="apiKey">API Key de ElevenLabs</label>
    <input type="password" id="apiKey" placeholder="sk_..." autocomplete="off" autofocus />
    <p class="hint">
      Encuéntrala en <a href="https://elevenlabs.io/app/settings/api-keys" target="_blank">elevenlabs.io → Settings → API Keys</a>.
      Solo se guarda en tu sesión del navegador.
    </p>
    <button id="btnEnter" onclick="login()">Entrar</button>
    <div class="error-msg" id="errorMsg"></div>
  </div>

  <script>
    const input = document.getElementById('apiKey');
    const btn   = document.getElementById('btnEnter');
    const err   = document.getElementById('errorMsg');

    input.addEventListener('keydown', e => { if (e.key === 'Enter') login(); });

    // Si ya hay sesión activa, ir directo a la app
    if (sessionStorage.getItem('xi_key')) window.location.href = '/app.html';

    async function login() {
      const key = input.value.trim();
      if (!key) return;
      btn.disabled = true;
      btn.textContent = 'Verificando…';
      err.textContent = '';

      try {
        // Verificar la key llamando a ElevenLabs directamente
        const res = await fetch('https://api.elevenlabs.io/v1/voices', {
          headers: { 'xi-api-key': key }
        });
        if (res.ok) {
          sessionStorage.setItem('xi_key', key);
          window.location.href = '/app.html';
        } else if (res.status === 401) {
          showError('API key inválida — verifica que sea correcta');
        } else if (res.status === 403) {
          showError('La key no tiene permiso de Voces (voices_read)');
        } else {
          showError(`Error ${res.status} — intenta de nuevo`);
        }
      } catch (e) {
        showError('Error de conexión — intenta de nuevo');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Entrar';
      }
    }

    function showError(msg) {
      err.textContent = msg;
      const card = document.querySelector('.card');
      card.classList.remove('shake');
      void card.offsetWidth;
      card.classList.add('shake');
    }
  </script>
</body>
</html>
